name: harness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest scripts/test_ontology_benchmark.py
      - run: python3 -m unittest adapters/test_adapters.py
      - run: python3 -m unittest scripts/test_prepare_kqapro.py
      - run: bun install --cwd fixtures/ontology --frozen-lockfile
      - run: bunx tsc --noEmit --skipLibCheck --moduleResolution bundler --module esnext --target es2022 fixtures/ontology/lobu.config.ts
      - run: cd fixtures/ontology && node_modules/.bin/lobu validate
